[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "switcheroo-linux"
version = "1.0.0"
description = "The incremental-search task switcher for Linux Mint and Cinnamon"
readme = "README.md"
authors = [
    { name = "Vivek", email = "vivek@example.com" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: GTK",
    "Topic :: Desktop Environment :: Window Managers",
]
requires-python = ">=3.8"
dependencies = [
    "PyGObject>=3.36.0",
]

[project.scripts]
switcheroo = "switcheroo.app:main"

[project.urls]
Homepage = "https://github.com/v1v3kgithub/switcheroo-linux"

[tool.setuptools.packages.find]
where = ["."]
include = ["switcheroo*"]

[tool.setuptools.package-data]
"switcheroo.ui" = ["*.css"]
