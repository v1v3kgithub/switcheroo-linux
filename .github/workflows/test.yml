name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # Use the distribution's Python and PyGObject, as Switcheroo does at runtime.
    # Building PyGObject from PyPI would need the cairo and gobject-introspection
    # development headers, and is not how the application is installed.
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-gi gir1.2-gtk-3.0 gir1.2-wnck-3.0 gir1.2-keybinder-3.0 gir1.2-ayatanaappindicator3-0.1

    - name: Check GObject Bindings
      run: |
        /usr/bin/python3 --version
        /usr/bin/python3 -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('Wnck', '3.0'); from gi.repository import Gtk, Wnck"

    - name: Run Tests
      run: |
        /usr/bin/python3 -m unittest discover -s tests -v
