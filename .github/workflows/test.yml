name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-wnck-3.0 gir1.2-keybinder-3.0 gir1.2-ayatanaappindicator3-0.1 libglib2.0-dev

    - name: Install Python Package
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run Tests
      run: |
        python -m unittest discover -s tests -v
